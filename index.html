<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI 급식 칼로리 도우미 & 사용자 게시판</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col items-center p-4 sm:p-6">

  <div class="w-full max-w-md mx-auto space-y-6">

    <header class="text-center pt-2 pb-1">
      <div class="inline-flex items-center justify-center p-3 bg-emerald-100 text-emerald-600 rounded-2xl mb-3 shadow-sm">
        <i class="fa-solid fa-utensils text-2xl"></i>
      </div>
      <h1 class="text-2xl font-bold text-slate-900 tracking-tight">AI 급식 칼로리 도우미</h1>
      <p class="text-sm text-slate-500 mt-1">급식 사진을 찍어 칼로리를 분석하고 의견을 나눠보세요</p>
    </header>

    <div class="flex bg-slate-200/80 p-1 rounded-xl font-medium text-sm text-slate-600">
      <button id="tab-analyzer-btn" onclick="switchTab('analyzer')" class="flex-1 py-2 rounded-lg bg-white text-emerald-600 shadow-sm transition-all duration-200 font-semibold">
        <i class="fa-solid fa-camera mr-1.5"></i>칼로리 분석
      </button>
      <button id="tab-board-btn" onclick="switchTab('board')" class="flex-1 py-2 rounded-lg hover:text-slate-900 transition-all duration-200">
        <i class="fa-solid fa-comments mr-1.5"></i>의견 게시판
      </button>
    </div>

    <section id="section-analyzer" class="space-y-4">
      <div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-100">
        <div id="uploadContainer" onclick="document.getElementById('imageInput').click()" 
             class="border-2 border-dashed border-slate-300 hover:border-emerald-500 hover:bg-emerald-50/50 rounded-xl p-6 text-center cursor-pointer transition-all duration-200 group">
          
          <input type="file" id="imageInput" accept="image/*" capture="environment" class="hidden" onchange="handleImageSelect(event)" />
          
          <div id="uploadPrompt" class="space-y-2">
            <div class="w-12 h-12 rounded-full bg-emerald-50 text-emerald-600 flex items-center justify-center mx-auto group-hover:scale-110 transition-transform duration-200">
              <i class="fa-solid fa-cloud-arrow-up text-xl"></i>
            </div>
            <p class="text-sm font-semibold text-slate-700">급식 사진 업로드 또는 촬영</p>
            <p class="text-xs text-slate-400">클릭하여 사진을 선택하세요 (자동 압축 처리)</p>
          </div>

          <div id="previewWrapper" class="hidden relative">
            <img id="imagePreview" alt="급식 미리보기" class="w-full h-52 object-cover rounded-lg shadow-sm" />
            <span id="compressionBadge" class="absolute bottom-2 left-2 bg-slate-900/75 text-white text-[10px] px-2 py-1 rounded-md backdrop-blur-sm">
              <i class="fa-solid fa-bolt text-amber-400 mr-1"></i>이미지 압축 완료
            </span>
            <button type="button" onclick="resetImage(event)" class="absolute top-2 right-2 bg-slate-900/60 hover:bg-slate-900 text-white w-7 h-7 rounded-full flex items-center justify-center transition-colors">
              <i class="fa-solid fa-xmark text-sm"></i>
            </button>
          </div>
        </div>

        <button id="analyzeBtn" onclick="analyzeImage()" disabled 
                class="w-full mt-4 py-3 bg-emerald-600 hover:bg-emerald-700 active:bg-emerald-800 text-white font-semibold rounded-xl shadow-sm transition-all duration-200 disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center space-x-2">
          <i class="fa-solid fa-wand-magic-sparkles"></i>
          <span>칼로리 분석하기</span>
        </button>
      </div>

      <div id="loadingCard" class="hidden bg-white rounded-2xl p-8 shadow-sm border border-slate-100 text-center space-y-3">
        <div class="inline-block animate-spin text-emerald-600 text-3xl">
          <i class="fa-solid fa-circle-notch"></i>
        </div>
        <p class="font-semibold text-slate-700">AI가 급식 사진을 분석하고 있습니다...</p>
        <p class="text-xs text-slate-400">음식 종류 인식 및 영양소 계산 중 ⏳</p>
      </div>

      <div id="resultCard" class="hidden bg-white rounded-2xl p-5 shadow-sm border border-slate-100 space-y-4">
        <div class="flex items-center justify-between border-b border-slate-100 pb-3">
          <h2 class="font-bold text-slate-800 text-lg flex items-center">
            <i class="fa-solid fa-chart-pie text-emerald-600 mr-2"></i>분석 결과
          </h2>
          <span class="text-xs font-semibold px-2.5 py-1 bg-emerald-100 text-emerald-700 rounded-full">AI 분석완료</span>
        </div>

        <div class="bg-gradient-to-r from-emerald-500 to-teal-600 text-white rounded-xl p-4 text-center shadow-sm">
          <span class="text-xs uppercase tracking-wider opacity-90 block mb-1">총 예상 칼로리</span>
          <span id="totalCalories" class="text-3xl font-extrabold tracking-tight">0</span>
          <span class="text-sm font-medium opacity-90 ml-1">kcal</span>
        </div>

        <div class="grid grid-cols-3 gap-2">
          <div class="bg-slate-50 p-3 rounded-xl text-center border border-slate-100">
            <span class="text-xs text-slate-500 font-medium block">탄수화물</span>
            <span id="carbVal" class="text-sm font-bold text-slate-800 mt-0.5 block">-</span>
          </div>
          <div class="bg-slate-50 p-3 rounded-xl text-center border border-slate-100">
            <span class="text-xs text-slate-500 font-medium block">단백질</span>
            <span id="proteinVal" class="text-sm font-bold text-slate-800 mt-0.5 block">-</span>
          </div>
          <div class="bg-slate-50 p-3 rounded-xl text-center border border-slate-100">
            <span class="text-xs text-slate-500 font-medium block">지방</span>
            <span id="fatVal" class="text-sm font-bold text-slate-800 mt-0.5 block">-</span>
          </div>
        </div>

        <div>
          <h3 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">인식된 음식 항목</h3>
          <div id="foodList" class="divide-y divide-slate-100 rounded-xl bg-slate-50 px-3 py-1 border border-slate-100"></div>
        </div>

        <div class="bg-amber-50 border border-amber-200/60 rounded-xl p-3.5 flex items-start space-x-2.5">
          <i class="fa-solid fa-lightbulb text-amber-500 text-base mt-0.5 shrink-0"></i>
          <p id="adviceText" class="text-xs text-amber-900 leading-relaxed font-medium"></p>
        </div>
      </div>
    </section>

    <section id="section-board" class="hidden space-y-4">
      <div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-100 space-y-3">
        <h2 class="font-bold text-slate-800 text-base flex items-center">
          <i class="fa-solid fa-pen-to-square text-emerald-600 mr-2"></i>의견 남기기
        </h2>
        <form id="post-form" class="space-y-3">
          <div>
            <input type="text" id="author-input" placeholder="작성자 이름" required 
                   class="w-full px-3.5 py-2.5 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 transition-all" />
          </div>
          <div>
            <textarea id="content-input" placeholder="급식 메뉴나 칼로리 정확도에 대한 의견을 적어주세요..." required rows="3"
                      class="w-full px-3.5 py-2.5 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 transition-all resize-none"></textarea>
          </div>
          <button type="submit" id="submit-btn" 
                  class="w-full py-2.5 bg-slate-900 hover:bg-slate-800 active:bg-slate-950 text-white font-semibold text-sm rounded-xl shadow-sm transition-all duration-200 flex items-center justify-center space-x-1.5">
            <i class="fa-solid fa-paper-plane text-xs"></i>
            <span>의견 등록하기</span>
          </button>
        </form>
      </div>

      <div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-100 space-y-3">
        <div class="flex items-center justify-between border-b border-slate-100 pb-2.5">
          <h2 class="font-bold text-slate-800 text-base flex items-center">
            <i class="fa-solid fa-list-ul text-emerald-600 mr-2"></i>게시글 목록
          </h2>
          <span class="text-xs text-slate-400">실시간 최신순</span>
        </div>

        <div id="posts-list" class="space-y-3">
          <div class="text-center py-6 text-slate-400 text-sm">
            <i class="fa-solid fa-spinner animate-spin mr-1"></i> 게시글을 불러오는 중...
          </div>
        </div>
      </div>
    </section>

  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getFirestore, 
      collection, 
      addDoc, 
      query, 
      orderBy, 
      onSnapshot, 
      serverTimestamp 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Firebase 설정값
    const firebaseConfig = {
      apiKey: "AIzaSyDAXhqYXFJQ1dJCiV0T7qOP9BaMLVCO_P8",
      authDomain: "hongjunesung-88a58.firebaseapp.com",
      projectId: "hongjunesung-88a58",
      storageBucket: "hongjunesung-88a58.firebasestorage.app",
      messagingSenderId: "598799668717",
      appId: "1:598799668717:web:668ad18910c4c6ace283e4",
      measurementId: "G-478QYCRRTQ"
    };

    // Firebase 및 Firestore 초기화
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // DOM 참조
    const postForm = document.getElementById("post-form");
    const authorInput = document.getElementById("author-input");
    const contentInput = document.getElementById("content-input");
    const postsList = document.getElementById("posts-list");

    // 글 저장 함수 (Firestore)
    postForm.addEventListener("submit", async (e) => {
      e.preventDefault();

      const author = authorInput.value.trim();
      const content = contentInput.value.trim();

      if (!author || !content) return;

      const submitBtn = document.getElementById("submit-btn");
      submitBtn.disabled = true;
      submitBtn.innerHTML = `<i class="fa-solid fa-circle-notch animate-spin text-xs"></i> <span>저장 중...</span>`;

      try {
        await addDoc(collection(db, "feedback"), {
          author: author,
          content: content,
          createdAt: serverTimestamp()
        });

        authorInput.value = "";
        contentInput.value = "";
      } catch (error) {
        console.error("Firestore 등록 실패:", error);
        alert("글 저장에 실패했습니다. 다시 시도해 주세요.");
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = `<i class="fa-solid fa-paper-plane text-xs"></i> <span>의견 등록하기</span>`;
      }
    });

    // 실시간 게시글 수신 및 최신순 정렬
    const q = query(
      collection(db, "feedback"), 
      orderBy("createdAt", "desc")
    );

    onSnapshot(q, (snapshot) => {
      postsList.innerHTML = "";

      if (snapshot.empty) {
        postsList.innerHTML = `
          <div class="text-center py-8 text-slate-400">
            <i class="fa-regular fa-comment-dots text-3xl mb-2 block"></i>
            <p class="text-xs">아직 작성된 의견이 없습니다. 첫 의견을 남겨보세요!</p>
          </div>
        `;
        return;
      }

      snapshot.forEach((doc) => {
        const data = doc.data();
        const date = data.createdAt ? new Date(data.createdAt.toDate()).toLocaleString("ko-KR", {
          month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'
        }) : "방금 전";

        const postCard = document.createElement("div");
        postCard.className = "p-3 bg-slate-50 border border-slate-100 rounded-xl space-y-1.5 transition-all hover:border-slate-200";

        postCard.innerHTML = `
          <div class="flex items-center justify-between">
            <span class="text-xs font-bold text-slate-800 flex items-center">
              <i class="fa-solid fa-circle-user text-slate-400 mr-1.5 text-sm"></i>${escapeHtml(data.author)}
            </span>
            <span class="text-[10px] text-slate-400">${date}</span>
          </div>
          <p class="text-xs text-slate-600 whitespace-pre-wrap leading-relaxed">${escapeHtml(data.content)}</p>
        `;

        postsList.appendChild(postCard);
      });
    }, (error) => {
      console.error("Firestore 수신 에러:", error);
      postsList.innerHTML = `<p class="text-xs text-rose-500 text-center py-4">게시글을 불러오지 못했습니다.</p>`;
    });

    function escapeHtml(text) {
      if (!text) return "";
      return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }
  </script>

  <script>
    let selectedCompressedBase64 = '';
    let selectedMimeType = '';

    // 탭 전환 핸들러
    function switchTab(tabName) {
      const analyzerBtn = document.getElementById('tab-analyzer-btn');
      const boardBtn = document.getElementById('tab-board-btn');
      const sectionAnalyzer = document.getElementById('section-analyzer');
      const sectionBoard = document.getElementById('section-board');

      if (tabName === 'analyzer') {
        analyzerBtn.className = "flex-1 py-2 rounded-lg bg-white text-emerald-600 shadow-sm transition-all duration-200 font-semibold";
        boardBtn.className = "flex-1 py-2 rounded-lg hover:text-slate-900 transition-all duration-200 font-normal";
        sectionAnalyzer.classList.remove('hidden');
        sectionBoard.classList.add('hidden');
      } else {
        boardBtn.className = "flex-1 py-2 rounded-lg bg-white text-emerald-600 shadow-sm transition-all duration-200 font-semibold";
        analyzerBtn.className = "flex-1 py-2 rounded-lg hover:text-slate-900 transition-all duration-200 font-normal";
        sectionBoard.classList.remove('hidden');
        sectionAnalyzer.classList.add('hidden');
      }
    }

    // 이미지 선택 및 자동 압축 처리
    function handleImageSelect(event) {
      const file = event.target.files[0];
      if (!file) return;

      selectedMimeType = file.type || 'image/jpeg';
      const reader = new FileReader();

      reader.onload = function(e) {
        const rawBase64 = e.target.result;

        // 이미지 압축 적용 (최대 너비 1024px, 품질 0.75)
        compressImage(rawBase64, selectedMimeType, 1024, 0.75).then(compressedBase64 => {
          selectedCompressedBase64 = compressedBase64.split(',')[1];

          // UI 미리보기 업데이트
          document.getElementById('imagePreview').src = compressedBase64;
          document.getElementById('uploadPrompt').classList.add('hidden');
          document.getElementById('previewWrapper').classList.remove('hidden');
          document.getElementById('analyzeBtn').disabled = false;
        }).catch(err => {
          console.error("이미지 압축 오류:", err);
          selectedCompressedBase64 = rawBase64.split(',')[1];
          document.getElementById('imagePreview').src = rawBase64;
          document.getElementById('uploadPrompt').classList.add('hidden');
          document.getElementById('previewWrapper').classList.remove('hidden');
          document.getElementById('analyzeBtn').disabled = false;
        });
      };

      reader.readAsDataURL(file);
    }

    // 이미지 리셋
    function resetImage(event) {
      event.stopPropagation();
      document.getElementById('imageInput').value = '';
      selectedCompressedBase64 = '';
      selectedMimeType = '';
      document.getElementById('uploadPrompt').classList.remove('hidden');
      document.getElementById('previewWrapper').classList.add('hidden');
      document.getElementById('analyzeBtn').disabled = true;
      document.getElementById('resultCard').classList.add('hidden');
    }

    // Canvas 기반 이미지 압축 함수
    function compressImage(srcBase64, mimeType, maxWidth = 1024, quality = 0.75) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.src = srcBase64;
        img.onload = () => {
          const canvas = document.createElement('canvas');
          let width = img.width;
          let height = img.height;

          if (width > maxWidth) {
            height = Math.round(height * (maxWidth / width));
            width = maxWidth;
          }

          canvas.width = width;
          canvas.height = height;

          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);

          const compressed = canvas.toDataURL(mimeType === 'image/png' ? 'image/png' : 'image/jpeg', quality);
          resolve(compressed);
        };
        img.onerror = reject;
      });
    }

    // AI 이미지 분석 호출 (서버리스 함수 /api/generate 경유)
    async function analyzeImage() {
      if (!selectedCompressedBase64) return;

      const loadingCard = document.getElementById('loadingCard');
      const resultCard = document.getElementById('resultCard');
      const analyzeBtn = document.getElementById('analyzeBtn');

      loadingCard.classList.remove('hidden');
      resultCard.classList.add('hidden');
      analyzeBtn.disabled = true;

      // Vercel Serverless Function 호출 경로
      const apiUrl = '/api/generate';

      const payload = {
        imageBase64: selectedCompressedBase64,
        mimeType: selectedMimeType || "image/jpeg"
      };

      try {
        const response = await fetch(apiUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        if (!response.ok) {
          const errorData = await response.json().catch(() => ({}));
          throw new Error(errorData.error || `API 응답 오류 (${response.status})`);
        }

        const parsedData = await response.json();
        renderResults(parsedData);

      } catch (err) {
        console.error("AI 분석 오류:", err);
        alert("칼로리 분석 중 오류가 발생했습니다: " + err.message);
      } finally {
        loadingCard.classList.add('hidden');
        analyzeBtn.disabled = false;
      }
    }

    // 분석 결과 화면 렌더링
    function renderResults(data) {
      document.getElementById('totalCalories').innerText = data.totalCalories || 0;
      document.getElementById('carbVal').innerText = data.nutrients?.carbs || '0g';
      document.getElementById('proteinVal').innerText = data.nutrients?.protein || '0g';
      document.getElementById('fatVal').innerText = data.nutrients?.fat || '0g';
      document.getElementById('adviceText').innerText = data.advice || '균형 잡힌 식단을 유지하세요!';

      const foodListContainer = document.getElementById('foodList');
      foodListContainer.innerHTML = '';

      if (data.items && data.items.length > 0) {
        data.items.forEach(item => {
          const row = document.createElement('div');
          row.className = 'flex justify-between items-center py-2 text-xs border-b border-slate-100 last:border-b-0';
          row.innerHTML = `
            <span class="font-medium text-slate-700">${item.name}</span>
            <span class="font-bold text-emerald-600 bg-emerald-50 px-2 py-0.5 rounded-md">${item.calories} kcal</span>
          `;
          foodListContainer.appendChild(row);
        });
      } else {
        foodListContainer.innerHTML = '<p class="text-xs text-slate-400 py-2 text-center">세부 음식을 구별하지 못했습니다.</p>';
      }

      document.getElementById('resultCard').classList.remove('hidden');
    }
  </script>
</body>
</html>
